name: release

# A pull request builds and smoke tests the packages. A pushed tag
# v<upstream version>-invite<N> (for example v1.12.0-invite1) also publishes a
# GitHub Release with build provenance and adds the packages to the INVITE
# Networks apt repository.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          # arm64 is off until it is needed; re-enable with this line:
          # - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # Built on the only supported target, Debian 13.
    container: rust:1.96-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Revision from the tag
        id: rev
        run: |
          . ./upstream.env
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            case "$GITHUB_REF_NAME" in
              "${KANIDM_TAG}"-invite[0-9]*) ;;
              *) echo "tag $GITHUB_REF_NAME does not match upstream $KANIDM_TAG (expected ${KANIDM_TAG}-inviteN)"; exit 1 ;;
            esac
            echo "revision=${GITHUB_REF_NAME#"${KANIDM_TAG}"-}" >> "$GITHUB_OUTPUT"
          else
            echo "revision=invite0" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/build-deps.sh
      - run: scripts/package.sh "${{ steps.rev.outputs.revision }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: dist
      - run: scripts/smoke.sh

  release:
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.deb > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  apt:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          repository: invite-networks/apt
          ssh-key: ${{ secrets.APT_DEPLOY_KEY }}
          path: apt
      - name: Add the packages to the apt repository
        run: |
          dest=apt/pool/main/k/kanidm
          mkdir -p "$dest"
          cp dist/*.deb "$dest/"
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool
          git commit -m "kanidm client $GITHUB_REF_NAME"
          git push
